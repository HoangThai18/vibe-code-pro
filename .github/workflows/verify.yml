# .github/workflows/verify.yml: the code shown in the references runs, and the docs still match it
name: Verify examples
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-match-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 verify/tools/check_docs.py
      - run: python3 verify/tools/check_copies.py

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend-core, search, payments, notifications, realtime, data-import, i18n, seo, next-actions, jobs, app-security, privacy, ai]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: verify/${{ matrix.project }}
      - name: verify/tools/run.sh ${{ matrix.project }}
        run: |
          verify/tools/run.sh ${{ matrix.project }} 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log "${{ matrix.project }}"; exit "$s"
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432

  mobile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/mobile/app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: verify/mobile/app
      - name: verify/tools/run.sh mobile
        run: |
          verify/tools/run.sh mobile 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log mobile; exit "$s"
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432

  desktop-electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/desktop/electron-app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: verify/desktop/electron-app
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: xvfb-run -a npm run verify
        working-directory: verify/desktop/electron-app
        run: |
          xvfb-run -a npm run verify 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 ../../tools/annotate.py verify.log electron; exit "$s"

  laravel:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, intl, pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('verify/laravel/composer.lock') }}
      - name: verify/tools/run.sh laravel
        run: |
          verify/tools/run.sh laravel 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log laravel; exit "$s"
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432
          MYSQL_URL: mysql://root:root@127.0.0.1:3306

  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: verify/dotnet/**/packages.lock.json
      - name: verify/tools/run.sh dotnet
        run: |
          verify/tools/run.sh dotnet 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log dotnet; exit "$s"
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432

  spring:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: verify/spring/pom.xml
      - name: verify/tools/run.sh spring
        run: |
          verify/tools/run.sh spring 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log spring; exit "$s"
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/mysql/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: verify/mysql
      - name: verify/tools/run.sh mysql
        run: |
          verify/tools/run.sh mysql 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log mysql; exit "$s"
        env:
          PG_URL: none
          MYSQL_URL: mysql://root:root@127.0.0.1:3306
