# .github/workflows/verify.yml: the code shown in the references runs, and the docs still match it
name: Verify examples
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-match-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 verify/tools/check_docs.py

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [search, payments, notifications, realtime, data-import, i18n, seo, next-actions, jobs, app-security, privacy, ai]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: verify/${{ matrix.project }}
      - name: verify/tools/run.sh ${{ matrix.project }}
        run: |
          verify/tools/run.sh ${{ matrix.project }} 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log "${{ matrix.project }}"; exit "$s"
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432

  mobile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/mobile/app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: verify/mobile/app
      - name: verify/tools/run.sh mobile
        run: |
          verify/tools/run.sh mobile 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 verify/tools/annotate.py verify.log mobile; exit "$s"
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432

  desktop-electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/desktop/electron-app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: verify/desktop/electron-app
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: xvfb-run -a npm run verify
        working-directory: verify/desktop/electron-app
        run: |
          xvfb-run -a npm run verify 2>&1 | tee verify.log; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || python3 ../../tools/annotate.py verify.log electron; exit "$s"
