<!doctype html><meta charset="utf-8"><body><pre id="o"></pre><script>
const cp = s => JSON.stringify(s) + " " + [...s].filter(c=>c.codePointAt(0)>0x7e||c===' ').map(c=>"U+"+c.codePointAt(0).toString(16).toUpperCase().padStart(4,"0")).join(",");
const d = new Date("2026-10-24T08:30:00Z"); const tz = "Asia/Ho_Chi_Minh";
const out = [
 navigator.userAgent,
 "money " + cp(new Intl.NumberFormat("vi-VN",{style:"currency",currency:"VND"}).format(1250000)),
 "vi dt " + cp(new Intl.DateTimeFormat("vi-VN",{timeZone:tz,dateStyle:"short",timeStyle:"short"}).format(d)),
 "vi fields " + cp(new Intl.DateTimeFormat("vi-VN",{timeZone:tz,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(d)),
 "en time " + cp(new Intl.DateTimeFormat("en-US",{timeZone:tz,timeStyle:"short"}).format(d)),
 "en dt " + cp(new Intl.DateTimeFormat("en-US",{timeZone:tz,dateStyle:"medium",timeStyle:"short"}).format(d)),
 "resolved hcm " + new Intl.DateTimeFormat("en",{timeZone:tz}).resolvedOptions().timeZone,
 "default tz " + Intl.DateTimeFormat().resolvedOptions().timeZone,
 "collator " + ["Đặng","Dương","Ánh","Bình","Anh"].sort(new Intl.Collator("vi").compare).join(","),
 "temporal " + typeof Temporal,
 "plural vi " + new Intl.PluralRules("vi").resolvedOptions().pluralCategories.join("/") + " en " + new Intl.PluralRules("en").resolvedOptions().pluralCategories.join("/"),
];
document.getElementById("o").textContent = out.join("\n");
</script>
